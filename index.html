<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFDFB">
<title>소이 카드뽑기</title>
<style>
  :root{color-scheme:light only}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html{background:#FFFDFB;color-scheme:light only}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(120% 52% at 50% -14%,#FFE9F3 0%,rgba(255,233,243,0) 62%),
      radial-gradient(80% 44% at 106% 102%,#E6F3FF 0%,rgba(230,243,255,0) 62%),
      radial-gradient(66% 40% at -6% 94%,#FFF7EA 0%,rgba(255,247,234,0) 60%),
      #FFFDFB;
    background-color:#FFFDFB;
    color:#3F2B3C;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme:dark){
    html,body{background-color:#FFFDFB;color-scheme:light only}
  }
  /* ---------- floating background ---------- */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg i{position:absolute;display:block;opacity:.28;animation:floaty var(--dur,10s) ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(255,170,205,.14))}
  @keyframes floaty{0%,100%{transform:translate3d(0,0,0) rotate(-4deg)}50%{transform:translate3d(0,-20px,0) rotate(6deg)}}

  /* ---------- header ---------- */
  header{position:relative;z-index:3;padding:18px 18px 0;text-align:center}
  h1{margin:0;font-size:22px;letter-spacing:-.7px;font-weight:800;color:#3B2737}
  .hud{display:flex;gap:9px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
  .pill{position:relative;display:inline-flex;align-items:center;gap:7px;border:1.5px solid #FFDDEC;font:inherit;font-weight:800;
    font-size:14px;padding:9px 15px;border-radius:999px;cursor:pointer;touch-action:manipulation;
    color:#D24A86;background:#FFFFFF;
    box-shadow:0 3px 10px rgba(233,160,196,.16);
    transition:transform .12s ease,box-shadow .12s ease}
  .pill:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(233,160,196,.2)}
  .pill.dex{color:#7C5BB5;border-color:#E9DFFB;box-shadow:0 3px 10px rgba(170,140,220,.16)}
  .pill.dex:active{box-shadow:0 1px 4px rgba(170,140,220,.2)}
  .pill b{font-size:14px;font-weight:900}
  .pill .heartcount{font-size:13px;letter-spacing:.5px}

  /* ---------- main ---------- */
  main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 16px 26px;gap:10px}
  .hint{margin:0;font-size:14px;font-weight:700;color:#8A7286;letter-spacing:-.2px;text-align:center;line-height:1.4;
    background:rgba(255,255,255,.82);border:1px solid #FFEAF3;border-radius:999px;padding:8px 18px}
  .hint b{color:#EE5E9E}

  .deck{position:relative;width:100%;max-width:380px;height:330px;display:flex;align-items:center;justify-content:center;perspective:1200px}
  .deck:after{content:"";position:absolute;left:50%;bottom:2px;width:220px;height:30px;margin-left:-110px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(210,160,190,.18),rgba(255,255,255,0) 72%);filter:blur(5px);pointer-events:none}
  .deck:before{content:"";position:absolute;width:280px;height:280px;left:50%;top:50%;margin:-140px 0 0 -140px;border-radius:50%;
    background:radial-gradient(circle,#FFFFFF 0%,rgba(255,241,248,.9) 40%,rgba(255,255,255,0) 72%);
    filter:blur(6px);pointer-events:none}
  .card{position:absolute;width:142px;height:206px;border:0;padding:0;background:transparent;font:inherit;
    cursor:pointer;touch-action:manipulation;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .35s ease;
    will-change:transform}
  .card .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;box-shadow:0 10px 22px rgba(190,120,160,.16),0 2px 6px rgba(190,120,160,.08)}
  /* --- back : bright pastel holo card --- */
  .back{background:
      radial-gradient(120% 90% at 20% 8%,rgba(255,255,255,.95),rgba(255,255,255,0) 58%),
      radial-gradient(90% 70% at 88% 92%,rgba(255,238,196,.6),rgba(255,255,255,0) 60%),
      linear-gradient(150deg,#FFE9F4 0%,#F3E8FF 30%,#E6F0FF 56%,#E6FBF4 78%,#FFF4DF 100%);
    border:1.5px solid #FFFFFF}
  .back:before{content:"";position:absolute;inset:5px;border-radius:12px;
    background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,0) 42%,rgba(255,255,255,.6) 60%,rgba(255,255,255,0) 78%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),inset 0 0 0 3px rgba(247,219,162,.95),inset 0 0 22px rgba(255,240,249,.95)}
  .back:after{content:"";position:absolute;top:-40%;left:-60%;width:70%;height:190%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
    transform:rotate(18deg);animation:shimmer 3.6s ease-in-out infinite}
  @keyframes shimmer{0%{left:-70%}55%{left:120%}100%{left:120%}}
  .back .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
  .back .gem{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.45) 38%,rgba(255,255,255,0) 62%),
      conic-gradient(from 210deg,#FFD3E9,#FFF1C9,#D6EEFF,#E7D6FF,#FFD3E9);
    box-shadow:0 0 0 2px rgba(255,255,255,.98),0 0 0 4px rgba(246,219,170,.85),0 8px 18px rgba(220,150,190,.24),inset 0 0 12px rgba(255,255,255,.95);
    animation:pulseGem 2.6s ease-in-out infinite}
  @keyframes pulseGem{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .back .gem svg{width:26px;height:24px;filter:drop-shadow(0 1px 1px rgba(255,255,255,.9))}
  .back .spark{position:absolute;color:#FFB9DB;font-size:11px;text-shadow:0 0 6px #fff;animation:twinkle 2.2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  /* --- front (small reveal on card) --- */
  .front{transform:rotateY(180deg);background:#FFFFFF;
    box-shadow:0 10px 22px rgba(190,120,160,.18),inset 0 0 0 2px #FFFFFF,inset 0 0 0 4px #FFD9EA}
  .front img{width:100%;height:82%;object-fit:contain;padding:8px 6px 0;display:block}
  .front .nm{height:18%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#6B4459;
    background:linear-gradient(180deg,#FFF8FC,#FFEAF5);letter-spacing:-.3px}
  .card.flipped{transform:rotateY(180deg)}

  .cardwrap{position:absolute;left:50%;top:50%;margin:-103px 0 0 -71px;transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .4s ease;will-change:transform}
  .cardwrap:active{filter:brightness(1.02)}
  .cardwrap.lift{transform:translateY(-8px) scale(1.06)!important;z-index:5}

  /* ---------- done / complete ---------- */
  .panel{width:100%;max-width:340px;text-align:center;padding:22px 18px;border-radius:26px;
    background:#FFFFFF;
    box-shadow:0 14px 32px rgba(210,150,185,.16),0 1px 0 #fff;border:1.5px solid #FFEAF4}
  .panel h2{margin:0 0 6px;font-size:19px;color:#3E2A3A;letter-spacing:-.5px}
  .panel p{margin:0;font-size:13.5px;color:#8A7286;line-height:1.55}
  .panel .big{font-size:36px;margin-bottom:4px}
  .btn{margin-top:14px;border:0;font:inherit;font-weight:800;font-size:14px;padding:12px 24px;border-radius:999px;cursor:pointer;
    touch-action:manipulation;color:#fff;background:linear-gradient(180deg,#FF93C4,#F4669F);
    box-shadow:0 6px 16px rgba(240,100,160,.28)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 8px rgba(240,100,160,.28)}
  .btn.ghost{color:#7A5A86;background:#FFFFFF;border:1.5px solid #F0E4FA;box-shadow:0 4px 12px rgba(170,140,210,.14)}

  /* ---------- fx layer ---------- */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .p{position:absolute;left:0;top:0;will-change:transform,opacity;animation:pfly var(--d) cubic-bezier(.18,.72,.25,1) forwards}
  @keyframes pfly{
    0%{transform:translate3d(var(--x),var(--y),0) scale(.15) rotate(0deg);opacity:0}
    12%{opacity:1}
    58%{transform:translate3d(calc(var(--x) + var(--mx)),calc(var(--y) + var(--my)),0) scale(1) rotate(var(--mr));opacity:1}
    100%{transform:translate3d(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty)),0) scale(.45) rotate(var(--rot));opacity:0}
  }
  .p svg{display:block;filter:drop-shadow(0 3px 6px rgba(255,120,180,.3))}
  .amb{position:fixed;bottom:-40px;opacity:0;animation:rise linear forwards;will-change:transform,opacity}
  @keyframes rise{
    0%{opacity:0;transform:translate3d(0,0,0) scale(.55) rotate(-8deg)}
    18%{opacity:.95}
    100%{opacity:0;transform:translate3d(var(--dx),-102vh,0) scale(1.15) rotate(26deg)}
  }

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 34%,#FFFFFF 0%,rgba(255,253,255,.99) 34%,rgba(255,247,251,.985) 66%,rgba(245,251,255,.99) 100%);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:18px;animation:fadein .28s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .stage{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
  /* rotating aura */
  .aura{position:absolute;top:50%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,196,226,.34),rgba(255,243,201,.30),rgba(200,230,255,.32),rgba(224,202,255,.32),rgba(255,196,226,.34));
    filter:blur(26px);animation:spin 11s linear infinite;z-index:0;pointer-events:none}
  .rays{position:absolute;top:50%;left:50%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,240,247,.95) 0deg 4deg,rgba(255,255,255,0) 4deg 15deg);
    mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,rgba(0,0,0,0) 62%);
    -webkit-mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,rgba(0,0,0,0) 62%);
    animation:spin 16s linear infinite reverse;z-index:0;pointer-events:none;opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}
  .photo{position:relative;z-index:2;width:min(78vw,286px);border-radius:26px;padding:10px 10px 0;
    background:#FFFFFF;
    box-shadow:0 18px 40px rgba(210,140,180,.2),0 2px 6px rgba(210,140,180,.1),inset 0 0 0 2px #FFFFFF,inset 0 0 0 4px #FFD9EA;
    transform:rotate(-1.2deg);animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}70%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(-1.2deg);opacity:1}}
  .photo .ribbon{position:absolute;z-index:6;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:11.5px;font-weight:800;letter-spacing:-.3px;color:#fff;padding:7px 16px;border-radius:999px;
    text-shadow:0 1px 2px rgba(150,60,110,.3);
    background:linear-gradient(92deg,var(--c1,#ff8fc4),var(--c2,#c98cff));
    box-shadow:0 4px 10px rgba(190,110,190,.28),inset 0 1px 0 rgba(255,255,255,.6)}
  .photo .imgbox{position:relative;border-radius:20px;overflow:hidden;background:
      radial-gradient(circle at 50% 42%,#FFFFFF 0%,#FFF7FC 55%,#F7F1FF 100%)}
  .photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;padding:6px}
  .photo .holo{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,0) 62%);
    transform:translateX(-120%);animation:sweep 3.4s ease-in-out .35s infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}45%{transform:translateX(120%)}100%{transform:translateX(120%)}}
  .photo .name{margin:2px -10px 0;padding:12px 10px 15px;text-align:center;border-radius:0 0 26px 26px;
    background:linear-gradient(180deg,#FFF7FC,#FFEAF6)}
  .photo .name b{font-size:22px;letter-spacing:-.6px;color:#3E2A3A}
  .stage .btn{position:relative;z-index:3}

  /* ---------- dex ---------- */
  #dex{padding:0;align-items:stretch;justify-content:stretch}
  .dexwrap{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;max-height:none;border-radius:0;border:0;box-shadow:none;
    display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(circle at 50% -10%,#FFF6FC 0%,#FFFFFF 42%,#FEFBFF 100%);
    animation:dexIn .32s cubic-bezier(.2,.9,.2,1) both}
  @keyframes dexIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
  .dexinner{width:100%;max-width:560px;margin:0 auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .dexhead{padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex:0 0 auto}
  .dexhead h2{margin:0;font-size:17px;font-weight:800;color:#3E2A3A;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
  .dexhead h2 i{font-style:normal;font-size:16px;line-height:1;display:inline-block;transform:translateY(.5px)}
  .dexhead .cnt{font-size:12px;color:#8E7391;font-weight:800;letter-spacing:.1px;background:#FBF2F8;
    border-radius:999px;padding:5px 11px;margin-left:auto;font-variant-numeric:tabular-nums}
  .close{border:0;background:#FFF2F8;color:#C2568C;width:32px;height:32px;border-radius:50%;font-size:13px;line-height:1;
    cursor:pointer;touch-action:manipulation;display:grid;place-items:center;padding:0;
    box-shadow:inset 0 0 0 1px rgba(255,214,234,.9);transition:background .15s ease}
  .close:active{background:#FFDDED}
  .prog{flex:0 0 auto;height:6px;border-radius:999px;background:#F7EBF3;margin:0 18px 14px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#FFA6CE,#C79BFF);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .grid{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:2px 18px calc(env(safe-area-inset-bottom,0px) + 28px);
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;grid-auto-rows:min-content;align-content:start}
  .cell{position:relative;border-radius:14px;overflow:hidden;background:#FFF9FD;width:100%;aspect-ratio:1/1;align-self:start;
    display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(196,146,178,.10),inset 0 0 0 1px #FFE7F2}
  .cell img{width:100%;height:100%;object-fit:contain;padding:4px;background:#fff}
  .cell .cn{position:absolute;left:0;right:0;bottom:0;font-size:11.5px;font-weight:800;text-align:center;letter-spacing:-.3px;
    color:#5C3B52;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95) 46%);padding:12px 4px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell.locked{display:grid;place-items:center;background:#FDF7FB;box-shadow:inset 0 0 0 1px #F8E8F3}
  .cell.locked:before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,0),rgba(255,255,255,0) 6px,rgba(255,240,248,.7) 6px,rgba(255,240,248,.7) 12px)}
  .cell.locked span{position:relative;font-size:19px;color:#DEC3D9;font-weight:900}
  .cell.new{box-shadow:inset 0 0 0 2px #FFB3D9,0 4px 10px rgba(255,140,190,.24)}
  .cell.open{padding:0;border:0;font:inherit;appearance:none;-webkit-appearance:none;cursor:pointer}
  .cell.open:active{transform:scale(.97)}
  .cell.open:focus-visible{outline:2px solid #FFB3D9;outline-offset:2px}
  .empty{grid-column:1/-1;padding:28px 10px;text-align:center;font-size:12.5px;color:#9C8298;line-height:1.6}
  .foot{grid-column:1/-1;margin-top:12px;padding:6px 2px 0;text-align:center;font-size:11.5px;font-weight:700;
    color:#C0A2B8;letter-spacing:-.2px;line-height:1.5}
  .dextip{margin:0 18px 10px;flex:0 0 auto;text-align:center;font-size:11.5px;font-weight:700;color:#B79CAB;letter-spacing:-.2px}

  /* ---------- dex detail ---------- */
  #detail{padding:0;align-items:stretch;justify-content:stretch;
    background:radial-gradient(circle at 50% 18%,#FFFFFF 0%,#FFF8FC 44%,#F3FAFF 100%)}
  .detailwrap{position:fixed;inset:0;width:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 54px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
    animation:fadein .2s ease both}
  .dinner{width:100%;display:flex;flex-direction:column;align-items:center;margin:auto 0}
  .dclose{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:6;
    border:0;background:#FFF2F8;color:#C2568C;width:36px;height:36px;border-radius:50%;font-size:15px;line-height:1;
    display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
    box-shadow:0 2px 8px rgba(233,160,196,.22),inset 0 0 0 1px rgba(255,214,234,.9)}
  .dclose:active{background:#FFDDED}
  .dphoto{position:relative;width:min(80vw,308px);aspect-ratio:1/1;border-radius:28px;background:#FFFFFF;
    padding:10px;display:grid;place-items:center;overflow:hidden;
    box-shadow:0 16px 36px rgba(210,140,180,.18),0 2px 6px rgba(210,140,180,.08),inset 0 0 0 2px #FFFFFF,inset 0 0 0 4px #FFD9EA;
    animation:detailpop .34s cubic-bezier(.2,1.15,.4,1) both}
  @keyframes detailpop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  .dphoto img{width:100%;height:100%;object-fit:contain;display:block;border-radius:20px;
    background:radial-gradient(circle at 50% 42%,#FFFFFF 0%,#FFF7FC 55%,#F7F1FF 100%)}
  .dphoto .holo{position:absolute;inset:0;border-radius:28px;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.55) 48%,rgba(255,255,255,0) 62%);
    transform:translateX(-120%);animation:sweep 3.6s ease-in-out .3s infinite}
  .dhead{margin-top:20px;text-align:center;max-width:340px}
  .dhead h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.6px;color:#3B2737}
  .dseries{display:inline-block;margin-top:10px;max-width:322px;font-size:12.5px;font-weight:800;line-height:1.4;
    color:#7C5BB5;background:#F8F2FF;border:1px solid #E9DFFB;border-radius:999px;padding:6px 14px}
  .ddesc{margin:16px 0 0;max-width:330px;font-size:14px;line-height:1.68;color:#6D5266;letter-spacing:-.1px;
    text-align:center;word-break:keep-all}
  #dOk{margin:22px 0 0;min-width:128px}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<header>
  <h1>소이 카드뽑기</h1>
  <div class="hud">
    <div class="pill" id="chances"><span class="heartcount" id="hearts">❤️❤️❤️</span><b id="cntText">3</b></div>
    <button type="button" class="pill dex" id="openDex">📖 도감 <b id="dexCnt">0/200</b></button>
  </div>
</header>

<main>
  <p class="hint" id="hint">카드 하나를 콕!</p>
  <div class="deck" id="deck"></div>
  <div id="doneBox" hidden></div>
</main>

<div class="fx" id="fx"></div>

<!-- reveal -->
<div class="modal" id="reveal" hidden>
  <div class="stage">
    <div class="aura"></div>
    <div class="rays"></div>
    <div class="photo" id="photo">
      <div class="ribbon" id="ribbon">캐치! 티니핑</div>
      <div class="imgbox"><img id="rImg" alt=""><div class="holo"></div></div>
      <div class="name"><b id="rName">하츄핑</b></div>
    </div>
    <button type="button" class="btn" id="rClose">다음 카드</button>
  </div>
</div>

<!-- collection -->
<div class="modal" id="dex" hidden>
  <div class="dexwrap" role="dialog" aria-modal="true" aria-labelledby="dexTitle">
    <div class="dexinner">
      <div class="dexhead">
        <h2 id="dexTitle"><i aria-hidden="true">📖</i>도감</h2>
        <span class="cnt" id="dexTotal">0/200</span>
        <button type="button" class="close" id="dexClose" aria-label="도감 닫기">✕</button>
      </div>
      <div class="prog" aria-hidden="true"><i id="dexBar"></i></div>
      <p class="dextip">카드를 콕 누르면 크게 볼 수 있어요</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<!-- dex detail -->
<div class="modal" id="detail" hidden>
  <div class="detailwrap" id="detailWrap" role="dialog" aria-modal="true" aria-labelledby="dName">
    <button type="button" class="dclose" id="dClose" aria-label="닫기">✕</button>
    <div class="dinner">
      <div class="dphoto"><img id="dImg" alt=""><div class="holo"></div></div>
      <div class="dhead">
        <h2 id="dName"></h2>
        <span class="dseries" id="dSeries"></span>
      </div>
      <p class="ddesc" id="dDesc"></p>
      <button type="button" class="btn ghost" id="dOk">닫기</button>
    </div>
  </div>
</div>

<!-- complete -->
<div class="modal" id="complete" hidden>
  <div class="stage">
    <div class="aura"></div>
    <div class="rays"></div>
    <div class="panel" style="position:relative;z-index:2">
      <div class="big">🎉</div>
      <h2>200종 완성!</h2>
      <p>소이가 모두 만났어요</p>
      <button type="button" class="btn" id="resetAll">처음부터</button>
    </div>
  </div>
</div>

    $('hint').hidden = false;
    $('hint').textContent = '카드 하나를 콕!';
    deck.hidden = false;

    if(rem <= 0){
      deck.innerHTML = '';
      deck.hidden = true;
      done.hidden = false;
      $('hint').hidden = true;
      done.innerHTML = '<div class="panel"><div class="big">🌙</div><h2>오늘 끝!</h2>' +
        '<p>내일 또 해요</p>' +
        '<button type="button" class="btn ghost" id="openDex2">도감 보기</button></div>';
      var b = $('openDex2'); if(b) b.addEventListener('click', openDex);
      return;
    }
    done.hidden = true;

    var show = Math.min(rem, left.length, 3);
    if(show <= 0){ deck.innerHTML = ''; return; }
    DECK = pickPool(left, show);

    deck.innerHTML = '';
    var positions = show === 3
      ? [{x:-104,r:-11,y:16},{x:0,r:0,y:-10},{x:104,r:11,y:16}]
      : show === 2 ? [{x:-72,r:-9,y:8},{x:72,r:9,y:8}]
      : [{x:0,r:0,y:4}];

    for(var k=0;k<show;k++){
      var ch = DECK[k];
      var wrap = document.createElement('div');
      wrap.className = 'cardwrap';
      var p = positions[k];
      wrap.style.transform = 'translate3d('+p.x+'px,'+p.y+'px,0) rotate('+p.r+'deg)';
      wrap.style.zIndex = String(10+k);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.setAttribute('aria-label', '카드 '+(k+1)+' 뒤집기');
      btn.dataset.idx = k;
      btn.innerHTML =
        '<div class="face back">' +
          '<div class="back-inner"></div>' +
          '<span class="spark" style="left:18%;top:16%">✦</span>' +
          '<span class="spark" style="right:16%;top:24%;animation-delay:.6s">✦</span>' +
          '<span class="spark" style="left:24%;bottom:18%;animation-delay:1.1s">✦</span>' +
          '<span class="spark" style="right:22%;bottom:26%;animation-delay:1.6s">✦</span>' +
          '<div class="mark">' +
            '<div class="gem"><svg viewBox="0 0 32 29"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffc0e0"/><stop offset="1" stop-color="#d5b8ff"/></linearGradient></defs></svg></div>' +
          '</div>' +
        '</div>' +
        '<div class="face front"><img src="'+imgSrc(ch.id)+'" alt=""><div class="nm">'+esc(ch.name)+'</div></div>';

      btn.addEventListener('click', function(ev){ onTapCard(ev.currentTarget); });
      wrap.appendChild(btn);
      deck.appendChild(wrap);

      (function(node){
        node.addEventListener('pointerdown', function(){ if(!busy) node.classList.add('lift'); });
        node.addEventListener('pointerup', function(){ node.classList.remove('lift'); });
        node.addEventListener('pointercancel', function(){ node.classList.remove('lift'); });
        node.addEventListener('pointerleave', function(){ node.classList.remove('lift'); });
      })(wrap);
    }
  }

  function onTapCard(btn){
    if(busy) return;
    if(btn.classList.contains('flipped')) return;
    busy = true;
    var idx = parseInt(btn.dataset.idx, 10);
    var ch = DECK[idx];
    if(!ch){ busy = false; return; }

    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

    btn.classList.add('flipped');
    burst(cx, cy, 0.85);
    if(navigator.vibrate){ try{ navigator.vibrate([12, 30, 18]); }catch(e){} }

    setTimeout(function(){
      burst(cx, cy, 1);
      reveal(ch);
    }, 320);
  }

  /* ---------------- reveal ---------------- */
  var lastChar = null;
  function reveal(ch){
    lastChar = ch;
    var colors = CAT_COLORS[ch.cat] || ['#ff8fc4','#c98cff'];
    var photo = $('photo');
    photo.style.setProperty('--c1', colors[0]);
    photo.style.setProperty('--c2', colors[1]);
    $('ribbon').textContent = ch.series;
    $('rName').textContent = ch.name;
    var im = $('rImg');
    im.src = imgSrc(ch.id);
    im.alt = ch.name;

    if(collected.indexOf(ch.id) < 0) collected.push(ch.id);
    draw.n = Math.min(3, draw.n + 1);
    save(K_COL, collected);
    save(K_DRAW, draw);

    // reveal burst from screen center
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.42, 1.35);

    $('reveal').hidden = false;
    ambientOn();
    $('rClose').textContent = (remaining() > 0 && collected.length < TOTAL) ? '다음 카드' : '확인';
    $('rClose').focus({preventScroll:true});
    setTimeout(function(){ burst(vw/2, vh*0.42, 0.9); }, 420);
  }

  $('rClose').addEventListener('click', function(){
    $('reveal').hidden = true;
    ambientOff();
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.5, 0.6);
    busy = false;
    render();
    if(collected.length >= TOTAL) showComplete();
  });

  /* ---------------- dex ---------------- */
  function openDex(){
    ambientOff();

    var n = 0, tot = TOTAL;
    CHARS.forEach(function(c){ if(collected.indexOf(c.id) >= 0) n++; });
    $('dexTotal').textContent = n + '/' + tot;
    $('dexBar').style.width = (tot ? (n / tot * 100) : 0) + '%';

    var grid = $('grid');
    grid.innerHTML = '';
    CHARS.forEach(function(c){
      var got = collected.indexOf(c.id) >= 0;
      var cell;
      if(got){
        cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell open';
        cell.setAttribute('aria-label', esc(c.name) + ' 크게 보기');
        cell.title = c.name + ' 크게 보기';
        cell.innerHTML = '<img loading="lazy" src="'+imgSrc(c.id)+'" alt="'+esc(c.name)+'"><div class="cn">'+esc(c.name)+'</div>';
        cell.addEventListener('click', function(){ openDetail(c); });
      } else {
        cell = document.createElement('div');
        cell.className = 'cell locked';
        cell.innerHTML = '<span>?</span>';
        cell.title = '아직 못 만난 친구';
      }
      grid.appendChild(cell);
    });
    if(!tot) grid.innerHTML = '<div class="empty">아직 없어요!</div>';
    if(tot){
      var foot = document.createElement('div');
      foot.className = 'foot';
      var more = tot - n;
      foot.textContent = more > 0 ? (more + '종 더 모을 수 있어요') : '여기 친구들은 다 만났어요!';
      grid.appendChild(foot);
    }
    grid.scrollTop = 0;
    $('dex').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  $('openDex').addEventListener('click', openDex);
  $('dexClose').addEventListener('click', function(){ $('dex').hidden = true; document.body.style.overflow=''; });
  $('dex').addEventListener('click', function(e){ if(e.target === $('dex')){ $('dex').hidden = true; document.body.style.overflow=''; } });

  /* ---------------- dex detail ---------------- */
  var dexScroll = 0;
  function openDetail(c){
    if(!c) return;
    dexScroll = $('grid').scrollTop;
    var im = $('dImg');
    im.src = imgSrc(c.id);
    im.alt = c.name;
    $('dName').textContent = c.name;
    var se = $('dSeries');
    se.textContent = c.series || '';
    se.hidden = !c.series;
    var de = $('dDesc');
    de.textContent = c.desc || '';
    de.hidden = !c.desc;
    $('detail').hidden = false;
    $('detailWrap').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    try{ $('dClose').focus({preventScroll:true}); }catch(e){}
  }
  function closeDetail(){
    if($('detail').hidden) return;
    $('detail').hidden = true;
    $('grid').scrollTop = dexScroll;
  }
  $('dClose').addEventListener('click', closeDetail);
  $('dOk').addEventListener('click', closeDetail);
  $('detail').addEventListener('click', function(e){
    if(e.target === $('detail') || e.target === $('detailWrap')) closeDetail();
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(!$('detail').hidden) closeDetail();
    else if(!$('dex').hidden){ $('dex').hidden = true; document.body.style.overflow=''; }
  });

  /* ---------------- complete ---------------- */
  var completedShown = false;
  function showComplete(){
    if(completedShown) return;
    completedShown = true;
    $('complete').hidden = false;
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.45, 1.6);
    setTimeout(function(){ burst(vw*0.3, vh*0.4, 0.9); burst(vw*0.7, vh*0.5, 0.9); }, 380);
    if(navigator.vibrate){ try{ navigator.vibrate([20,40,20,40,60]); }catch(e){} }
  }
  $('resetAll').addEventListener('click', function(){
    if(!window.confirm('도감을 비우고 처음부터 다시 모을까요?')) return;
    collected = [];
    draw = {date: today(), n: 0};
    save(K_COL, collected); save(K_DRAW, draw);
    completedShown = false;
    $('complete').hidden = true;
    render();
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.4, 1.1);
  });

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  // preload neighbours
  setTimeout(function(){
    uncollected().slice(0, 6).forEach(function(c){ var i = new Image(); i.src = imgSrc(c.id); });
  }, 300);

  window.__dbg = function(){ return {deck: DECK.map(function(c){ return c.id; }), collected: collected.slice(), draw: {date: draw.date, n: draw.n}}; };

  render();
  if(collected.length >= TOTAL) showComplete();
})();
</script>
</body>
</html>
